# A local IRC server, so a fresh install has somewhere to connect to.
#
# ergo is a single Go binary with no database and no services package to run
# separately - it does nick registration, channel registration and SASL itself.
# That matters here: testing the SASL path against a public network needs an
# account somebody has to create and keep, whereas this one is created and
# thrown away with the container.
#
#   docker compose -f docker/compose.yaml up -d
#   docker compose -f docker/compose.yaml logs -f ergo
#   docker compose -f docker/compose.yaml restart ergo     # to watch it reconnect
#
# 6667 plaintext, 6697 TLS with a self-signed certificate the container makes
# on first start. Bound to 127.0.0.1 so this is not accidentally a public IRC
# server on the homelab's network.

services:
  irc-web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: irc-web:local
    container_name: irc-web
    restart: unless-stopped
    depends_on:
      ergo:
        condition: service_healthy
    environment:
      # Inside the compose network the local server is reachable by service
      # name. Loopback here would be this container, which runs no IRC server.
      LOCAL_IRC_HOST: ergo
      IRC_WEB_DATA_DIR: /data
      # Set these to choose the first account rather than having one generated
      # and printed to the log. The key encrypts the stored IRC passwords;
      # without it one is generated into /data, which is fine until the volume
      # is copied somewhere the key is not.
      IRC_WEB_ADMIN_USERNAME: ${IRC_WEB_ADMIN_USERNAME:-admin}
      IRC_WEB_ADMIN_PASSWORD: ${IRC_WEB_ADMIN_PASSWORD:-}
      IRC_WEB_SECRET_KEY: ${IRC_WEB_SECRET_KEY:-}
    volumes:
      # The directory, the profiles and the encryption key live here. Without
      # this the stored servers and credentials vanish on every recreate.
      - irc-web-data:/data
    ports:
      # Bound to all interfaces deliberately: the point of running it this way
      # is to reach it from another machine. It has no authentication, so keep
      # it to a network you trust.
      - "8081:8081"

  ergo:
    image: ghcr.io/ergochat/ergo:v2.14.0
    container_name: irc-web-ergo
    restart: unless-stopped
    ports:
      - "127.0.0.1:6667:6667"
      - "127.0.0.1:6697:6697"
    volumes:
      - ergo-data:/ircd/data
    healthcheck:
      # A TCP accept is enough: if the port answers, the client can register.
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 6667 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  ergo-data:
  irc-web-data:
