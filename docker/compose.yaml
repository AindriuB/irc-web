# A local IRC server, so a fresh install has somewhere to connect to.
#
# ergo is a single Go binary with no database and no services package to run
# separately - it does nick registration, channel registration and SASL itself.
# That matters here: testing the SASL path against a public network needs an
# account somebody has to create and keep, whereas this one is created and
# thrown away with the container.
#
#   docker compose -f docker/compose.yaml up -d
#   docker compose -f docker/compose.yaml logs -f ergo
#   docker compose -f docker/compose.yaml restart ergo     # to watch it reconnect
#
# 6667 plaintext, 6697 TLS with a self-signed certificate the container makes
# on first start. Bound to 127.0.0.1 so this is not accidentally a public IRC
# server on the surrounding network.

services:
  irc-web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: irc-web:local
    # Not `irc-web`: the homelab deployment
    # (/home/andrew/homelab/compose/irc/compose.yaml) permanently owns that
    # name on this host, and the two stacks can run side by side.
    container_name: irc-web-dev
    restart: unless-stopped
    depends_on:
      ergo:
        condition: service_healthy
    environment:
      # Inside the compose network the local server is reachable by service
      # name. Loopback here would be this container, which runs no IRC server.
      LOCAL_IRC_HOST: ergo
      IRC_WEB_DATA_DIR: /data
      # This stack is the dev loop, not a deployment, so it keeps the 808x
      # range rather than the 8667 the image defaults to.
      SERVER_PORT: 8081
      # Leave the password empty and the first browser to arrive is asked to
      # choose an account. Set it before the first start instead to create that
      # account up front, for an install nobody is going to be sitting at.
      # The key encrypts the stored IRC passwords; without it one is generated
      # into /data, which is fine until the volume is copied somewhere the key
      # is not.
      IRC_WEB_ADMIN_USERNAME: ${IRC_WEB_ADMIN_USERNAME:-admin}
      IRC_WEB_ADMIN_PASSWORD: ${IRC_WEB_ADMIN_PASSWORD:-}
      IRC_WEB_SECRET_KEY: ${IRC_WEB_SECRET_KEY:-}
    volumes:
      # The directory, the profiles and the encryption key live here. Without
      # this the stored servers and credentials vanish on every recreate.
      - irc-web-data:/data
    ports:
      # Bound to all interfaces deliberately: the point of running it this way
      # is to reach it from another machine. Signing in is required, but the
      # traffic is plain HTTP, so put it behind a reverse proxy with TLS before
      # it is reachable from anywhere you do not control.
      - "8081:8081"
    healthcheck:
      # Overrides the image's default, which checks 8667: this stack runs the
      # app on 8081 via SERVER_PORT above.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  ergo:
    image: ghcr.io/ergochat/ergo:v2.14.0
    container_name: irc-web-ergo
    restart: unless-stopped
    ports:
      - "127.0.0.1:6667:6667"
      - "127.0.0.1:6697:6697"
    volumes:
      - ergo-data:/ircd/data
    healthcheck:
      # A TCP accept is enough: if the port answers, the client can register.
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 6667 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  ergo-data:
  irc-web-data:
