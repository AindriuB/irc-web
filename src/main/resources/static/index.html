<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irc-web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>irc-web</h1>
  <span id="state" class="state idle">idle</span>
  <span class="grow"></span>
  <span id="who" class="hint"></span>
  <button id="change-password" type="button" class="ghost small">password</button>
  <form method="post" action="/api/logout" id="logout-form">
    <button type="submit" class="ghost small">sign out</button>
  </form>
</header>

<main>
  <aside id="left">
    <form id="connect">
      <label>Server
        <select id="server" required></select>
      </label>
      <div class="server-actions">
        <button id="add-server" type="button" class="ghost small">add</button>
        <button id="edit-server" type="button" class="ghost small">edit</button>
        <button id="delete-server" type="button" class="ghost small">delete</button>
      </div>
      <p id="server-notes" class="notes"></p>

      <label>Nick
        <input id="nick" required autocomplete="off" spellcheck="false">
      </label>

      <label>Channels
        <input id="channels" placeholder="#test, #another" autocomplete="off"
               spellcheck="false">
      </label>

      <details id="auth">
        <summary>Authentication</summary>
        <label>Server password
          <input id="password" type="password" autocomplete="off"
                 placeholder="or a Twitch oauth: token">
        </label>
        <label>SASL account
          <input id="sasl-username" autocomplete="off" spellcheck="false"
                 placeholder="defaults to the nick">
        </label>
        <label>SASL password
          <input id="sasl-password" type="password" autocomplete="off">
        </label>
      </details>

      <div class="actions">
        <button id="go" type="submit">Connect</button>
        <button id="stop" type="button" class="ghost" disabled>Disconnect</button>
      </div>
      <button id="save-profile" type="button" class="ghost wide">Remember these details</button>
      <p id="profile-state" class="notes"></p>
    </form>

    <section id="channels-list">
      <h2>Buffers</h2>
      <ul id="channel-tabs"></ul>
    </section>
  </aside>

  <section id="centre">
    <div id="topic" class="topic"></div>
    <ol id="log"></ol>
    <form id="say">
      <input id="input" placeholder="message, or /join #chan, /part, /raw LIST"
             autocomplete="off" disabled>
      <button type="submit" disabled>Send</button>
    </form>
  </section>

  <aside id="right">
    <h2>Members <span id="member-count"></span></h2>
    <ul id="members"></ul>
  </aside>
</main>

<div id="user-menu" class="menu" hidden role="menu"></div>

<dialog id="server-dialog">
  <form id="server-form" method="dialog">
    <h2 id="server-dialog-title">Add a server</h2>

    <div class="row">
      <label>Name
        <input id="f-name" required autocomplete="off">
      </label>
      <label class="narrow">Id
        <input id="f-id" autocomplete="off" spellcheck="false"
               placeholder="from name">
      </label>
    </div>

    <div class="row">
      <label>Host
        <input id="f-host" required autocomplete="off" spellcheck="false">
      </label>
      <label class="narrow">Port
        <input id="f-port" type="number" min="1" max="65535" value="6697" required>
      </label>
    </div>

    <div class="checks">
      <label class="check"><input id="f-tls" type="checkbox" checked> TLS</label>
      <label class="check"><input id="f-sasl" type="checkbox"> supports SASL</label>
      <label class="check"><input id="f-registered" type="checkbox"> needs an account</label>
    </div>

    <label>Features
      <input id="f-features" autocomplete="off"
             placeholder="tls, sasl, isupport">
    </label>

    <label>Notes
      <textarea id="f-notes" rows="4"
                placeholder="anything about this network worth remembering — registration quirks, which channels to start in"></textarea>
    </label>

    <p id="server-error" class="error-text"></p>

    <menu>
      <button type="button" id="server-cancel" class="ghost">Cancel</button>
      <button type="button" id="server-save">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="password-dialog">
  <form id="password-form" method="dialog">
    <h2>Change password</h2>
    <label>Current password
      <input id="p-current" type="password" autocomplete="current-password" required>
    </label>
    <label>New password
      <input id="p-new" type="password" autocomplete="new-password" required minlength="8">
    </label>
    <p id="password-error" class="error-text"></p>
    <menu>
      <button type="button" id="password-cancel" class="ghost">Cancel</button>
      <button type="button" id="password-save">Change</button>
    </menu>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
