<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irc-web — sign in</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<main>
  <h1>irc-web</h1>
  <p class="sub">IRC in your browser, on your own server</p>

  <form method="post" action="/api/login">
    <label>Username
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <!-- Filled in below from the cookie. A form post carries no token otherwise
         and is refused, which looks exactly like a wrong password. -->
    <input type="hidden" id="csrf" name="_csrf">
    <button type="submit">Sign in</button>
  </form>

  <p id="message" class="message"></p>

  <p class="note">
    This is the account you chose when you set this install up. Forgotten it?
    See <code>Resetting the password</code> in the README.
  </p>
</main>

<script>
  const csrf = document.cookie.split('; ')
    .find((c) => c.startsWith('XSRF-TOKEN='))?.split('=')[1];
  if (csrf) { document.getElementById('csrf').value = csrf; }

  // Spring redirects here with a marker rather than a body, so the message is
  // assembled on this side.
  const params = new URLSearchParams(location.search);
  const message = document.getElementById('message');
  if (params.has('failed')) {
    message.textContent = 'That username and password did not match.';
    message.className = 'message bad';
  } else if (params.has('out')) {
    message.textContent = 'Signed out.';
    message.className = 'message good';
  } else if (params.has('created')) {
    message.textContent = 'Account created. Sign in with it.';
    message.className = 'message good';
  }
</script>
</body>
</html>
