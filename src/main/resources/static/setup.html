<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irc-web — first run</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="alternate icon" href="/brand/favicon.ico">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="theme-color" content="#12141A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="login.css">
</head>
<body>
<main>
  <div class="brand"><svg width="490" height="128" viewBox="0 0 490 128" role="img" aria-label="irc-web"><g transform="translate(12 16)"><g fill="none" stroke="var(--irc-brand-mark, #6AA9FF)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M39 18 29 77 M66 18 56 77 M20 36H78 M16 59H74"/>
    </g><circle cx="79" cy="77" r="5.5" fill="var(--irc-brand-dot, #79E2B2)"/></g><g fill="var(--irc-brand-wordmark, #F3F6FC)" transform="translate(132 86) scale(0.03515625 -0.03515625)"><path transform="translate(0 0)" d="M316 1116H787V143H1152V0H238V143H603V973H316ZM603 1551H787V1319H603Z"/><path transform="translate(1233 0)" d="M1155 889Q1096 935 1035.0 956.0Q974 977 901 977Q729 977 638.0 869.0Q547 761 547 557V0H362V1120H547V901Q593 1020 688.5 1083.5Q784 1147 915 1147Q983 1147 1042.0 1130.0Q1101 1113 1155 1077Z"/><path transform="translate(2466 0)" d="M1061 57Q987 14 908.5 -7.5Q830 -29 748 -29Q488 -29 341.5 127.0Q195 283 195 559Q195 835 341.5 991.0Q488 1147 748 1147Q829 1147 906.0 1126.0Q983 1105 1061 1061V868Q988 933 914.5 962.0Q841 991 748 991Q575 991 482.0 879.0Q389 767 389 559Q389 352 482.5 239.5Q576 127 748 127Q844 127 920.0 156.5Q996 186 1061 248Z"/><path transform="translate(3699 0)" d="M102 724H1162V555H102Z"/><path transform="translate(4932 0)" d="M0 1120H182L377 215L537 793H694L856 215L1051 1120H1233L971 0H795L616 614L438 0H262Z"/><path transform="translate(6165 0)" d="M1120 652V562H323V556Q315 327 410.5 227.0Q506 127 680 127Q768 127 864.0 155.0Q960 183 1069 240V57Q964 14 866.5 -7.5Q769 -29 678 -29Q417 -29 270.0 127.5Q123 284 123 559Q123 827 267.0 987.0Q411 1147 651 1147Q865 1147 988.5 1002.0Q1112 857 1120 652ZM936 706Q924 822 851.5 906.5Q779 991 643 991Q510 991 424.0 903.0Q338 815 330 705Z"/><path transform="translate(7398 0)" d="M918 559Q918 773 850.0 882.0Q782 991 649 991Q515 991 446.0 881.5Q377 772 377 559Q377 347 446.0 237.0Q515 127 649 127Q782 127 850.0 236.0Q918 345 918 559ZM377 977Q421 1059 498.5 1103.0Q576 1147 678 1147Q880 1147 996.0 991.5Q1112 836 1112 563Q1112 286 995.5 128.5Q879 -29 676 -29Q576 -29 499.5 14.5Q423 58 377 141V0H193V1556H377Z"/></g></svg></div>
  <p class="sub">Choose the account this install belongs to</p>

  <form id="setup">
    <label>Username
      <input id="username" autocomplete="username" required autofocus
             spellcheck="false" value="admin">
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="new-password" required>
    </label>
    <label>Repeat password
      <input id="repeat" type="password" autocomplete="new-password" required>
    </label>
    <button type="submit">Create account</button>
  </form>

  <p id="message" class="message"></p>

  <p class="note">
    Nothing is reachable until this is done, and there is no password to change
    afterwards because you are choosing it now.
  </p>
</main>

<script>
  const message = document.getElementById('message');
  let minimum = 8;

  function say(text, kind) {
    message.textContent = text;
    message.className = `message ${kind}`;
  }

  // Reading the state also makes the server set the CSRF cookie that the POST
  // below echoes back, so this is not only for the message.
  fetch('/api/setup')
    .then((r) => r.json())
    .then((state) => {
      minimum = state.minimumPasswordLength;
      if (!state.required) { location.href = '/login.html'; }
    })
    .catch(() => {});

  function token() {
    return document.cookie.split('; ')
      .find((c) => c.startsWith('XSRF-TOKEN='))?.split('=')[1] ?? '';
  }

  document.getElementById('setup').addEventListener('submit', async (event) => {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if (password !== document.getElementById('repeat').value) {
      say('Those two passwords are not the same.', 'bad');
      return;
    }
    if (password.length < minimum) {
      say(`The password must be at least ${minimum} characters.`, 'bad');
      return;
    }

    const response = await fetch('/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': token() },
      body: JSON.stringify({ username, password }),
    });

    if (response.ok) {
      say('Account created. Sending you to sign in…', 'good');
      location.href = '/login.html?created';
      return;
    }
    const body = await response.json().catch(() => ({}));
    say(body.error || 'That did not work.', 'bad');
  });
</script>
</body>
</html>
