name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A pull request builds the image to prove the Dockerfile still works, but
      # publishes nothing: an image from an unreviewed branch has no business in
      # the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=irc-web
            org.opencontainers.image.description=A web front end that exercises irc-client
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # A pushed image is pulled back by the probe below; an unpushed one
          # only exists in the buildx cache, so a pull request has to load it
          # into the daemon or there is nothing to docker run.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image starts and serves
        run: |
          # Building an image says it compiles. Starting it says it runs, which
          # is a different claim and the one that matters.
          docker run -d --name probe -p 8081:8081 \
            $(echo "${{ steps.meta.outputs.tags }}" | head -1)
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8081/health; then
              echo "image is healthy and its configuration loaded"
              docker rm -f probe
              exit 0
            fi
            sleep 2
          done
          echo "::error::image did not serve /health within 60s"
          docker logs probe
          docker rm -f probe
          exit 1
